# Сборка ZI Git (APK) в GitHub Actions.
#
# Зачем: приложение ZI Git — загрузчик артефактов. Чтобы у репозитория появились
# собственные сборки, нужен workflow с шагом actions/upload-artifact@v4.
# Этот файл и есть такой workflow: он собирает APK тем же скриптом build.sh,
# что и локально (без Gradle), и публикует результат как артефакт «ZI-Git-APK».
#
# Результат: Actions → запуск «Build APK» → артефакт ZI-Git-APK.zip,
# внутри — ZIGit.apk. В приложении: откройте запуск → «Скачать»
# (или удержите запуск → «Удалить артефакты запуска», чтобы почистить старые сборки).
# Ветку для ручного запуска можно выбрать: Actions → Build APK → Run workflow.

name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:        # кнопка «Run workflow» в интерфейсе GitHub

permissions:
  contents: write      # нужно только для шага с релизом (теги v*)

jobs:
  build:
    name: Сборка и подпись APK
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Android SDK (build-tools 34, platform 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Собрать и подписать APK
        run: |
          # setup-android выставляет ANDROID_SDK_ROOT; build.sh читает ANDROID_HOME
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          chmod +x build.sh
          ./build.sh

      - name: Показать результат
        run: |
          ls -la ghactions-app/out
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt2" dump badging \
            ghactions-app/out/ZIGit.apk | head -5

      - name: Диагностика APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=ghactions-app/out/ZIGit.apk
          {
            echo "size: $(stat -c%s "$APK")"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo
            echo "=== aapt2 dump badging ==="
            "$SDK/build-tools/34.0.0/aapt2" dump badging "$APK" | head -25 || true
            echo
            echo "=== apksigner verify -v ==="
            "$SDK/build-tools/34.0.0/apksigner" verify -v --print-certs "$APK" || true
            echo
            echo "=== unzip -l ==="
            unzip -l "$APK" || true
          } | tee apk-report.txt

      # Выкладывает собранный APK в отдельную ветку ci-apk: оттуда файл можно
      # скачать без авторизации в Actions (и он не попадает в основную ветку).
      - name: Выложить APK в ветку ci-apk
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "ZI Git CI"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/ci-apk
          cp ghactions-app/out/ZIGit.apk apk-report.txt /tmp/ci-apk/
          git checkout --orphan ci-apk
          git rm -r --cached . > /dev/null 2>&1 || true
          cp /tmp/ci-apk/ZIGit.apk /tmp/ci-apk/apk-report.txt .
          git add -f ZIGit.apk apk-report.txt
          git commit -m "ci: APK из запуска ${{ github.run_id }}"
          git push -f origin ci-apk

      # Именно этот шаг создаёт артефакт, который видно и можно скачать
      # в приложении. Без upload-artifact у запуска не будет ни одного артефакта.
      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ZI-Git-APK
          path: ghactions-app/out/ZIGit.apk
          if-no-files-found: error
          retention-days: 30

      # Дополнительно: тот же APK прикладывается к релизу, если это тег v*.
      - name: Приложить APK к релизу (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ghactions-app/out/ZIGit.apk
