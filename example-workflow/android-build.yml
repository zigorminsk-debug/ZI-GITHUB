# Готовый workflow: собирает debug APK и публикует его как артефакт,
# который потом видно и можно скачать в приложении Actions Loader.
#
# Куда положить: в корне вашего Android-проекта — .github/workflows/android-build.yml
# После push откройте приложение → введите owner/repo → у запуска «Build APK»
# появится артефакт «app-debug», кнопка «Скачать», а внутри архива — APK.

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # кнопка "Run workflow" в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Собрать debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Именно этот шаг создаёт артефакт, который скачивает приложение.
      # Без upload-artifact у запуска не будет ни одного артефакта.
      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30    # по умолчанию GitHub хранит артефакты 90 дней

      # Необязательно: сборка release APK (нужны секреты для подписи).
      # - name: Собрать release APK
      #   run: ./gradlew assembleRelease --no-daemon
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # - name: Загрузить release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release
      #     path: app/build/outputs/apk/release/*.apk

# Если проект собирается не Gradle-ом (например, чистый Java/Kotlin без Android),
# замените шаг сборки на свой и укажите в path любые нужные файлы, например:
#   path: build/*.jar
# Артефакт — всегда ZIP: даже один файл GitHub упаковывает в архив,
# приложение распаковывает его и предлагает установить APK.
